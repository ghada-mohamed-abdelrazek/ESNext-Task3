<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>🛒 Your Cart</h1>
  </header>

  <main>
    <div id="cartItems" class="cart-list"></div>

    <div class="cart-footer">
      <p id="totalPrice" class="total">Total: $0.00</p>
      <div class="buttons">
        <button id="continueShopping" class="btn blue">⬅ Continue Shopping</button>
        <button id="purchaseBtn" class="btn green">✅ Continue to Order</button>
      </div>
    </div>
  </main>

  <script src="index.js"></script>
</body>
</html>
